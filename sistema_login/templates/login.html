<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lanchonete DevJuan</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111,
                    #222
                );

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #111;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        /* MENSAGENS DO FLASK */

        .mensagem {
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 18px;

            text-align: center;
            font-weight: bold;

            background: #ffe5e5;
            color: #c62828;
            border: 1px solid #ffcaca;
        }

        .mensagem.sucesso {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        .campo input:focus {
            border-color: #ff9800;

            box-shadow:
                0 0 0 3px rgba(255, 152, 0, 0.15);
        }

        /* BOTÃO */

        .botao-login {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 10px;

            background: #ff9800;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .botao-login:hover {
            background: #e68900;
            transform: translateY(-1px);
        }

        .botao-login:active {
            transform: translateY(0);
        }

        /* CADASTRO */

        .cadastro {
            text-align: center;

            margin-top: 22px;

            color: #666;
        }

        .cadastro a {
            color: #ff9800;

            font-weight: bold;

            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        /* VOLTAR */

        .voltar {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;
        }

        .voltar:hover {
            color: #ff9800;
        }

        /* CELULAR */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🍔
        </div>

        <h1>
            Lanchonete DevJuan
        </h1>

        <p class="subtitulo">
            Entre na sua conta
        </p>


        <!-- =========================================
             MENSAGENS DO FLASK
        ========================================== -->

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% if mensagens %}

                {% for categoria, mensagem in mensagens %}

                    <div
                        class="mensagem {% if categoria == 'sucesso' %}sucesso{% endif %}"
                    >
                        {{ mensagem }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =========================================
             LOGIN
        ========================================== -->

        <form
            action="{{ url_for('login') }}"
            method="POST"
        >

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="botao-login"
            >
                Entrar
            </button>

        </form>


        <!-- =========================================
             CADASTRO
        ========================================== -->

        <div class="cadastro">

            Ainda não possui uma conta?

            <a href="{{ url_for('cadastro') }}">
                Criar conta
            </a>

        </div>


        <!-- =========================================
             VOLTAR
        ========================================== -->

        <a
            href="{{ url_for('home') }}"
            class="voltar"
       >
            ← Voltar para o início
        </a>

    </div>

</body>
</html>
