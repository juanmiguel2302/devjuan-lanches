<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedido recebido</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px 30px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(0,0,0,.1);
        }

        .icone {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #e8f8ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            margin: 0 auto 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .numero {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 12px;
            margin: 25px 0;
            font-size: 18px;
        }

        .status {
            border: 2px solid #ffcc00;
            background: #fffbea;

            padding: 18px;

            border-radius: 14px;

            margin-bottom: 25px;
        }

        .status strong {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .status span {
            color: #777;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        .acompanhar {
            background: #111;
            color: white;
        }

        .cardapio {
            background: #ffcc00;
            color: #111;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="icone">
        ✓
    </div>


    <h1>
        Pedido recebido! 🎉
    </h1>


    <p>
        Seu pedido foi enviado para a cozinha.
    </p>


    <div class="numero">

        Pedido nº

        <strong>
            #{{ pedido_id }}
        </strong>

    </div>


    <div class="status">

        <strong>
            🟡 Em processamento
        </strong>

        <span>
            Estamos preparando seu pedido.
        </span>

    </div>


    <div class="botoes">


        <button
            class="acompanhar"
            onclick="
                window.location.href='/meus-pedidos'
            "
        >
            📦 Acompanhar pedido
        </button>


        <button
            class="cardapio"
            onclick="
                window.location.href='/pedido'
            "
        >
            🍔 Voltar ao cardápio
        </button>


    </div>


</div>


</body>

</html>
